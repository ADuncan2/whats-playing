<!DOCTYPE html>
<html lang="en-GB">
<head>
  <!--
    $FLUTTER_BASE_HREF is replaced by `flutter build web --base-href`. The GitHub Pages workflow
    passes /whats-playing/ (the site lives at https://aduncan2.github.io/whats-playing/).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="London screenings you can get to, watch, and still be home in time.">

  <!-- Home-screen app on iPhone (Safari > Share > Add to Home Screen) and Android. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WhatsPlaying">
  <meta name="theme-color" content="#8E1B2E">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>WhatsPlaying</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #8E1B2E;">
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
